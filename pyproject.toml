[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jarvis"
version = "1.0.0"
description = "High-Performance Windows AI Desktop Assistant with Arc Reactor Glass HUD, Voice VAD, and Gmail Integration."
readme = "README.md"
authors = [
    { name = "Krishna Jadhav", email = "krishnajadhav1416@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "assistant", "voice", "windows", "pyqt6", "ollama", "whisper", "gmail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PyQt6>=6.6.0",
    "ollama>=0.1.6",
    "faster-whisper>=0.10.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.14",
    "webrtcvad>=2.0.10",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "pynput>=1.7.6",
    "pycaw>=20240210",
    "screen-brightness-control>=0.21.0",
    "psutil>=5.9.8",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
jarvis = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
